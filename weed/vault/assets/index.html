<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Vault · 业务接入台</title>
  <style>
    :root {
      font:
        15px/1.6 -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #20312b;
      background: #f2f3ed;
      --green: #245e49;
      --line: #d4dbd1;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
    }
    main {
      max-width: 1120px;
      margin: auto;
      padding: 44px 28px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 24px;
    }
    .brand {
      letter-spacing: 0.18em;
      font-size: 13px;
      color: var(--green);
      font-weight: 700;
    }
    h1 {
      font-size: 32px;
      line-height: 1.2;
      letter-spacing: -0.03em;
      margin: 10px 0;
    }
    h2 {
      font-size: 18px;
      margin: 0 0 18px;
    }
    .sub {
      color: #607066;
      margin: 0;
      font-size: 14px;
    }
    .badge {
      background: #e1e9dc;
      padding: 6px 13px;
      border-radius: 20px;
      font-size: 12px;
    }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 36px;
      margin-top: 32px;
    }
    section,
    aside {
      min-width: 0;
    }
    label {
      display: block;
      font-size: 13px;
      margin: 18px 0 6px;
    }
    input,
    select,
    button {
      font: inherit;
    }
    input,
    select {
      width: 100%;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    button {
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 14px;
      background: white;
      color: #20312b;
    }
    button.primary {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }
    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }
    :focus-visible {
      outline: 3px solid #9bb9a6;
      outline-offset: 3px;
    }
    .full {
      width: 100%;
      margin-top: 18px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 22px;
      margin-bottom: 22px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .hint {
      font-size: 12px;
      color: #607066;
      margin-top: 10px;
    }
    .files {
      max-height: 440px;
      overflow: auto;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .files li {
      padding: 14px 0;
      border-bottom: 1px solid #e7ebe5;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .files li:last-child {
      border: 0;
    }
    .name {
      font-weight: 600;
      word-break: break-word;
    }
    .meta {
      font-size: 12px;
      color: #657269;
    }
    .empty {
      text-align: center;
      padding: 42px 0;
      color: #647267;
    }
    #status {
      padding: 12px 0;
      min-height: 48px;
      white-space: pre-wrap;
      font-size: 13px;
    }
    #status.error {
      color: #a02b27;
    }
    #events {
      font:
        12px/1.65 ui-monospace,
        monospace;
      color: #607066;
      max-height: 130px;
      overflow: auto;
      white-space: pre-wrap;
    }
    progress {
      width: 100%;
      height: 6px;
      accent-color: var(--green);
    }
    #preview {
      max-height: 480px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #preview img,
    #preview video {
      max-width: 100%;
      max-height: 420px;
    }
    footer {
      margin-top: 25px;
      font-size: 12px;
      color: #6b796f;
    }
    @media (max-width: 700px) {
      main {
        padding: 24px 18px;
      }
      .layout {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      header {
        align-items: flex-start;
      }
      .badge {
        display: none;
      }
      .card {
        padding: 18px;
      }
    }
  </style>
  <main>
    <header>
      <div>
        <div class="brand">SEAWEED / VAULT</div>
        <h1>业务接入台</h1>
        <p class="sub">收藏留在云端，目录就在身边。</p>
      </div>
      <span class="badge">HTTP API · 本地示例</span>
    </header>
    <div class="layout">
      <aside>
        <h2>连接业务空间</h2>
        <label for="space">业务空间</label
        ><input id="space" value="notes" autocomplete="off" /><label for="token"
          >访问令牌</label
        ><input
          id="token"
          type="password"
          placeholder="粘贴该业务的访问令牌"
          autocomplete="off"
        /><label for="transport">读取方式</label
        ><select id="transport">
          <option value="auto">优先直读，跨域受限时中转</option>
          <option value="direct">客户端直接下载</option>
          <option value="proxy">通过 NAS 下载密文</option></select
        ><button class="primary full" id="connect">连接空间</button>
        <p class="hint">
          令牌仅保存在当前页面内存中。公网接入需要 HTTPS；网页通过 WebCrypto
          解密。
        </p>
        <div id="status" role="status" aria-live="polite">尚未连接</div>
        <div id="events" aria-label="读取记录"></div>
      </aside>
      <section>
        <div class="card">
          <h2>添加一组内容</h2>
          <p class="sub">正文与附件一起提交，相关文件尽量存入同一个块。</p>
          <label for="group">关联分组</label
          ><input id="group" placeholder="例如 trip-2026 或 note-001" /><label
            for="upload"
            >文件（支持多选）</label
          ><input id="upload" type="file" multiple />
          <div class="row" style="margin-top: 18px">
            <span class="hint">提交即保存至 NAS；满包后自动上传。</span
            ><button id="send" class="primary" disabled>上传并提交</button>
          </div>
          <progress id="progress" value="0" max="1" hidden></progress>
        </div>
        <div class="card">
          <div class="row">
            <h2>已保存的内容</h2>
            <button id="refresh" disabled>刷新</button>
          </div>
          <ul class="files" id="files">
            <li class="empty">连接空间后显示文件</li>
          </ul>
          <button id="sync" disabled>立即同步至云端</button>
          <button id="more" hidden>加载更多</button>
        </div>
        <div class="card" id="previewCard" hidden>
          <div class="row">
            <h2 id="previewTitle">预览</h2>
            <button id="closePreview">关闭</button>
          </div>
          <div id="preview"></div>
        </div>
      </section>
    </div>
    <footer>
      示例页面展示接入流程。大文件使用 SDK 的 stream()
      或命令行流式下载；页面预览限制为 32 MiB。
    </footer>
  </main>
  <script type="module" src="/sdk/demo.mjs"></script>
</html>
