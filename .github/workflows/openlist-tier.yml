name: OpenList tier amd64
on:
  push:
    branches: [codex/openlist-tier]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openlist-tier-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          path: seaweedfs
      - uses: actions/checkout@v7
        with:
          repository: ahaduoduoduo/autofilm-openlist
          ref: ee1a56215a890fc3100ce5e92695e49d6aeb0c2d
          path: openlist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.6"
          cache-dependency-path: |
            seaweedfs/go.sum
            openlist/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install realistic scenario dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-cryptography
          npm ci --prefix seaweedfs/test/vault
          cd seaweedfs/test/vault
          npx playwright install --with-deps chromium
      - name: Test tier storage regressions
        working-directory: seaweedfs
        run: go test ./weed/storage/backend/openlist_backend ./weed/storage/volume_info ./weed/storage -run 'Test.*(Remote|Tier|ReadOnly|VolumeInfo)' -count=1
      - name: Build linux amd64 binaries
        run: |
          mkdir -p build
          cd seaweedfs
          go build -trimpath -o ../build/weed ./weed
          cd ../openlist
          go build -trimpath -o ../build/openlist-lab ./cmd/seaweedfs-lab
      - name: Real process integration with local 115 simulator
        working-directory: seaweedfs
        run: python3 test/openlist/integration.py --weed ../build/weed --gateway ../build/openlist-lab
      - name: Multi-client Vault scenarios and browser interactions
        working-directory: seaweedfs
        run: python3 test/vault/scenarios.py --weed ../build/weed --openlist-lab ../build/openlist-lab
      - name: Sparse collections and manual cloud sync
        working-directory: seaweedfs
        run: python3 test/vault/sparse.py --weed ../build/weed --openlist-lab ../build/openlist-lab
      - name: Provider download signature headers and browser fallback
        working-directory: seaweedfs
        run: python3 test/vault/download_ua.py --weed ../build/weed --openlist-lab ../build/openlist-lab
      - name: Package language-independent client examples
        run: tar -czf build/vault-clients.tar.gz -C seaweedfs examples/vault weed/vault/assets docs/vault.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vault-scenario-results
          path: seaweedfs/build/vault-test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: seaweedfs-openlist-linux-amd64
          path: build/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: openlist-integration-failure-logs
          path: /tmp/seaweed-openlist-e2e-*/*.log
          retention-days: 7
  image:
    name: Publish verified Vault image (linux/amd64)
    needs: integration
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: seaweedfs-openlist-linux-amd64
          path: build
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile.vault
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ahaduoduoduo/seaweedfs-vault:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
